
name: Build Shortcuts APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDKMANAGER"
          chmod +x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          true

      - name: Install Android packages
        run: |
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-34"
          "$SDKMANAGER" "build-tools;34.0.0"

      - name: Extract project
        run: |
          unzip -o sary.zip -d project

      - name: Locate Gradle project
        run: |
          GRADLE_FILE=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project not found in sary.zip"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shortcuts-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
