
name: Build Shortcuts APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sary.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: |
          unzip -o sary.zip -d project
          echo "Project files:"
          ls -la project

      - name: Locate Gradle project
        run: |
          GRADLE_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project not found inside sary.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shortcuts-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
